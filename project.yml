name: NetBirdAdmin
options:
  bundleIdPrefix: de.kernelguru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.11"
    CURRENT_PROJECT_VERSION: "12"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.12.1"
targets:
  NetBirdAdmin:
    type: application
    platform: iOS
    sources:
      - path: NetBirdAdmin
      - path: Shared
    scheme: {}
    dependencies:
      - package: Citadel
        product: Citadel
      - target: NetBirdAdminWidget
    info:
      path: Config/App-Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - de.kernelguru.netbirdadmin.refresh
        UIBackgroundModes:
          - fetch
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.kernelguru.netbirdadmin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kernelguru.netbirdadmin
        PRODUCT_NAME: NetBirdAdmin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "NetBird Admin"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Verbindung zu deinem NetBird-Server im lokalen Netz bzw. über das NetBird-Overlay."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Schützt SSH-Schlüssel und API-Token."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  NetBirdAdminWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NetBirdWidget
      - path: Shared
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: "NetBird"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.kernelguru.netbirdadmin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kernelguru.netbirdadmin.widget
        PRODUCT_NAME: NetBirdAdminWidget
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
