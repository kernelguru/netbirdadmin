name: NetBirdAdmin
options:
  bundleIdPrefix: de.kernelguru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.12.1"
targets:
  NetBirdAdmin:
    type: application
    platform: iOS
    sources:
      - path: NetBirdAdmin
    scheme: {}
    dependencies:
      - package: Citadel
        product: Citadel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kernelguru.netbirdadmin
        PRODUCT_NAME: NetBirdAdmin
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "NetBird Admin"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Verbindung zu deinem NetBird-Server im lokalen Netz bzw. über das NetBird-Overlay."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Schützt SSH-Schlüssel und API-Token."
        ENABLE_PREVIEWS: YES
