name: iOS Release (IPA)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. v0.10)"
        required: true
        default: "v0.10"

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen (neueste)
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Release-Build für Geräte (unsigniert)
        run: |
          set -o pipefail
          xcodebuild -project NetBirdAdmin.xcodeproj -scheme NetBirdAdmin \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Ad-hoc signieren (Entitlements für App Group / Widget)
        run: |
          APP=build/Build/Products/Release-iphoneos/NetBirdAdmin.app
          for X in "$APP"/PlugIns/*.appex; do
            [ -d "$X" ] && codesign -f -s - --entitlements Config/Widget.entitlements "$X"
          done
          codesign -f -s - --entitlements Config/App.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true
          ls "$APP/PlugIns"
      - name: IPA packen
        run: |
          APP=build/Build/Products/Release-iphoneos/NetBirdAdmin.app
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry "NetBirdAdmin-${TAG}.ipa" Payload)
          shasum -a 256 "dist/NetBirdAdmin-${TAG}.ipa" | tee "dist/NetBirdAdmin-${TAG}.ipa.sha256"
      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "release-notes/${TAG}.md" ]; then cp "release-notes/${TAG}.md" notes.md
          else echo "NetBird Admin ${TAG}" > notes.md; fi
          printf '\n\n**Hinweis:** Die IPA ist ad-hoc signiert. Installation per AltStore, SideStore, Sideloadly oder nach Re-Signierung mit eigenem Apple-Developer-Zertifikat.\n' >> notes.md
          gh release create "$TAG" dist/NetBirdAdmin-${TAG}.ipa dist/NetBirdAdmin-${TAG}.ipa.sha256 \
            --title "NetBird Admin ${TAG}" --notes-file notes.md --prerelease --target "$GITHUB_SHA" \
          || gh release upload "$TAG" dist/NetBirdAdmin-${TAG}.ipa dist/NetBirdAdmin-${TAG}.ipa.sha256 --clobber
